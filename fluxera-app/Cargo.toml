[package]
name = "fluxera-app"
version = "0.1.0"
edition = "2021"
authors = ["Fluxera Team"]
description = "Linera WebAssembly application for Fluxera Analytics"

[dependencies]
async-graphql = "7.0"
async-trait = "0.1"
bcs = "0.1"
futures = "0.3"
linera-sdk = { path = "../linera-protocol/linera-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Dev dependencies not needed for WASM builds
# [dev-dependencies]

# Two binaries: contract and service
[[bin]]
name = "fluxera_app_contract"
path = "src/contract.rs"

[[bin]]
name = "fluxera_app_service"
path = "src/service.rs"

[profile.release]
debug = false
lto = true
opt-level = "z"
strip = true

[workspace]
